.tab:hover,.tab:focus-visible,.tab[aria-current="page"]{width:168px;box-shadow:var(--shadow-raised)}
.tab:hover .tl,.tab:focus-visible .tl,.tab[aria-current="page"] .tl{opacity:1}
.tab[aria-current="page"]{width:52px}
.tab[aria-current="page"]:hover{width:168px}
.tab[aria-current="page"] .tl{opacity:0}.tab[aria-current="page"]:hover .tl{opacity:1}
.tab .tn{min-width:16px;text-align:center}
.tab svg{width:12px;height:12px;flex:0 0 auto}
@media (min-width:981px){:root{--tabw:40px} .wrap,.full-in{padding-right:calc(var(--gut-r) + var(--tabw))}}
.spine{display:none}
@media (max-width:980px){
  .tabs{display:none}
  .spine{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:65;height:calc(44px + env(safe-area-inset-bottom,0px));padding:0 var(--gut-r) env(safe-area-inset-bottom,0px) var(--gut);background:var(--surface);border-top:1px solid var(--border);align-items:center;gap:10px}
  .spine-btn{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;min-height:44px;color:var(--text-heading);font:600 13px/18px var(--sans);padding:0}
  .spine-bars{display:flex;flex:1;height:22px;gap:2px}
  .spine-bars i{flex:1;border-radius:2px;background:var(--g)}
  body{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
}
.spine-sheet .sheet-p{top:auto;bottom:0;left:0;right:0;width:auto;max-height:82vh;border-radius:16px 16px 0 0;padding:20px var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gut)}
.spine-list{display:grid;gap:6px;margin-top:12px}
.spine-list a{display:flex;align-items:center;gap:14px;background:var(--g);color:var(--t);text-decoration:none;border-radius:8px;padding:12px 16px;font:600 15px/20px var(--sans)}
.spine-list a .tn{font:300 22px/1 var(--sans);min-width:28px}
.spine-list a small{margin-left:auto;font-weight:400;opacity:.85;font-size:12px}

/* ===================================================== säsongsytor */
.wash{background-color:var(--g);background-image:var(--img);background-size:cover;background-position:center;color:var(--t)}
.wash h1,.wash h2,.wash h3,.wash b,.wash .quote,.wash .hand{color:var(--t)}
.wash .eyebrow{color:var(--e)}
/* små etiketter på säsongsytor får en platta i ytans grundfärg så att mönstret aldrig äter kontrasten */
.wash .eyebrow,.sky-lines .k{background:var(--g);display:table;padding:2px 9px;margin-left:-9px;border-radius:999px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wash .card .eyebrow,.wash .pc:not(.wash) .eyebrow,.wash .sheet-p .eyebrow{background:none;padding:0;margin-left:0}
.wash{--text-accent:var(--e,#E6B65A);--text-accent-sm:var(--e,#E6B65A)}
.wash p,.wash .lead{color:var(--t)}
.wash a:not(.btn){color:var(--t)}
.wash .muted{color:var(--t);opacity:.85}
.strip{height:10px;background-color:var(--g);background-image:var(--img);background-size:cover;background-position:center 30%}

/* ===================================================== himlen (startsidan) */
.sky{position:relative;min-height:min(46vh,440px);display:grid;align-items:end}
.sky-in{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding-block:44px 36px;align-items:end;width:100%}
.sky-big{font:300 clamp(40px,6vw,76px)/1 var(--sans);letter-spacing:-.03em;margin:0 0 10px}
.sky-lines{display:grid;gap:12px;border-left:1px solid color-mix(in srgb,var(--t) 40%,transparent);padding-left:24px}
.sky-lines p{margin:0;font-size:15px;line-height:23px}
.sky-lines .k{font:600 11px/16px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--e);margin-bottom:2px}
.sky .quote{font-size:clamp(20px,2.2vw,26px);max-width:24ch}
@media (max-width:760px){.sky-in{grid-template-columns:minmax(0,1fr)}.sky-lines{border-left:0;padding-left:0;border-top:1px solid color-mix(in srgb,var(--t) 40%,transparent);padding-top:16px}}

/* ===================================================== hero och karta */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:center;padding-block:64px 48px}
.hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.04;letter-spacing:-.02em}
.hero .quote{margin-top:28px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:40px}}
.map-fig{margin:0;position:relative}
.map{width:100%;height:auto;display:block;border-radius:var(--r-lg);touch-action:manipulation}
.map .pl{cursor:pointer}
.map .pl:focus{outline:none}
.map .pl:focus-visible .mk{stroke:var(--focus);stroke-width:4}
.map .pl:hover .mk{transform:scale(1.08)}
.map .mk{transition:transform .2s ease-out;transform-box:fill-box;transform-origin:center}
.map text{font-family:var(--sans)}
.map .sys{opacity:0;transition:opacity .3s ease-out}
.map.sys-on .sys{opacity:1}
.map .lys{display:none}
:root[data-tid="natt"] .map .lys{display:inline}
.map-cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px}
.pcard{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-raised);display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px;align-items:center}
.pcard[hidden]{display:none}
.pcard img{width:120px;height:96px;object-fit:cover;border-radius:var(--r-sm);mix-blend-mode:var(--plate-blend)}
.pcard h3{margin:0 0 4px;font-size:17px}
.pcard p{margin:0 0 6px;font-size:14px;line-height:21px}
.pcard .x{position:absolute;top:4px;right:4px}
@media (max-width:520px){.pcard{position:static;margin-top:12px;grid-template-columns:88px 1fr}.pcard img{width:88px;height:76px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ===================================================== kapitelöppning */
.opener{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:min(78vh,720px)}
.opener .ak-side{position:relative;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:40px 24px 24px var(--gut)}
.opener .ak-side figure{margin:0;width:100%}
.opener .ak-side img{width:100%;max-height:62vh;object-fit:contain;mix-blend-mode:var(--plate-blend)}
.opener .txt-side{display:flex;flex-direction:column;justify-content:flex-end;padding:40px calc(var(--gut-r) + var(--tabw)) 44px 40px}
.opener .folio{font:200 clamp(64px,9vw,128px)/.9 var(--sans);letter-spacing:-.04em;margin-bottom:auto;opacity:.92}
.opener h1{font-size:clamp(32px,4.4vw,52px);line-height:1.05;margin-top:28px}
.opener .lead{font-size:17px;line-height:27px}
@media (max-width:860px){.opener{grid-template-columns:minmax(0,1fr);min-height:0}.opener .ak-side{padding:24px var(--gut-r) 8px var(--gut)}.opener .txt-side{padding:28px var(--gut-r) 32px var(--gut)}.opener .folio{font-size:64px;margin-bottom:12px}}
figure{margin:0}
figcaption{font:400 13px/20px var(--sans);color:var(--text-muted);margin-top:8px}
.ak{position:relative}
picture{display:contents}
.ak img{width:100%;border-radius:0;mix-blend-mode:var(--plate-blend)}
.ak.crop img{aspect-ratio:4/3;object-fit:cover}
.ak.wide img{aspect-ratio:16/9;object-fit:cover}
.photo img{border-radius:var(--r-md);aspect-ratio:4/3;object-fit:cover;width:100%}
.wash .ak img{mix-blend-mode:normal}

/* ===================================================== plansch */
.plate{background:var(--plate-ground);color:var(--text-body);padding:0}
.plate .kick{font:600 11px/16px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-accent-sm,var(--text-accent));display:block;margin-bottom:8px}
.plate img{width:100%;aspect-ratio:4/5;object-fit:cover;mix-blend-mode:var(--plate-blend)}
.plate[data-g="natt"] img,.plate img.natt{mix-blend-mode:normal}
.plate h3{margin:14px 0 2px;font-size:18px}
.plate .lat{font:italic 400 15px/22px var(--serif);color:var(--text-muted);margin:0 0 8px}
.plate .lat.rak{font-style:normal;font-family:var(--sans);font-size:13px}
/* motivtext: gravyrplanschens bildtext, centrerad direkt under bilden */
.plate .pl-cap{text-align:center;padding:10px 8px 12px;margin:0 0 8px}
.plate .pl-cap::before{content:"";display:block;width:36px;height:1px;margin:0 auto 9px;background:currentColor;opacity:.45}
.plate .pl-cap h3{margin:0;font:italic 400 21px/1.25 var(--serif);letter-spacing:.005em;color:var(--pl-ink,var(--text-body))}
.plate .pl-cap .pl-l{margin:4px 0 0;font:400 12.5px/18px var(--sans);letter-spacing:.06em;color:var(--pl-ink2,var(--text-muted))}
.plate.mini .pl-cap{padding:8px 4px 6px;margin-bottom:4px}
.plate.mini .pl-cap::before{width:24px;margin-bottom:7px}
.plate.mini .pl-cap h3,.herb .plate .pl-cap h3{font-size:16px;margin:0}
.plate.mini .pl-cap .pl-l{font-size:11.5px;line-height:16px;letter-spacing:.04em}
.plate[data-g="dag"] .pl-cap{--pl-ink:#2B3A31;--pl-ink2:#5A4636}
.plate .pl-cap .pl-l.lat-i{font:italic 400 15px/20px var(--serif);letter-spacing:0}
.plate.mini .pl-cap .pl-l.lat-i{font-size:13.5px;line-height:18px}
.plate .pt{font-size:14px;line-height:22px;margin:0 0 8px}
.plate figcaption{font-size:12px;line-height:18px}
.plate .warn{display:inline-block;font:600 12px/16px var(--sans);color:var(--text-heading);border:1px solid currentColor;border-radius:var(--r-pill);padding:2px 9px;margin:0 0 8px}
.plate.mini h3{font-size:15px;margin-top:10px}
.plate.mini .lat{font-size:13px;line-height:18px}
a.pl-card{text-decoration:none;color:inherit;display:block}
a.pl-card:hover h3{text-decoration:underline}
.plate-solo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:860px){.plate-solo{grid-template-columns:minmax(0,1fr);gap:24px}}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.twin figure{padding:12px;border-radius:var(--r-sm)}
.twin .tdag{background:var(--kalk);color:var(--bark)}
.twin .tdag img{mix-blend-mode:multiply}
.twin .tnatt{background:var(--nattskog);color:var(--manljus)}
.twin figcaption{color:inherit;opacity:.8}

/* ===================================================== kort, tabeller, listor */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;box-shadow:var(--shadow-card)}
.card h3{margin-bottom:6px}
.card p{font-size:15px;line-height:24px;margin-bottom:0}
.card.alt{background:var(--surface-alt);box-shadow:none}
.andl .card{background:var(--a-surface);border-color:var(--a-rule);box-shadow:var(--a-shadow);padding:24px}
.andl .card.ljung{background:var(--a-ljung-ton);box-shadow:none;border-color:transparent}
.andl .card.ljung h3,.andl .card.ljung .eyebrow{color:var(--a-ljung-text)}
.pc{display:block;text-decoration:none;color:inherit;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-card);transition:transform .2s ease-out}
.pc:hover{transform:translateY(-2px)}
.pc img{aspect-ratio:3/2;object-fit:cover;width:100%;mix-blend-mode:var(--plate-blend)}
.pc .pc-b{padding:16px 18px 18px}
.pc.wash{background-color:var(--g);background-image:var(--img);background-size:cover;background-position:center;color:var(--t)}
.pc.wash p,.pc.wash h2,.pc.wash h3{color:var(--t)}
.wash .pc:not(.wash){color:var(--text-body);--text-accent:#B5523C;--text-accent-sm:#A1402D}.wash .pc:not(.wash) h3,.wash .pc:not(.wash) h2,.wash .pc:not(.wash) b{color:var(--text-heading)}.wash .pc:not(.wash) p,.wash .pc:not(.wash) .lead{color:var(--text-body)}.wash .pc:not(.wash) .eyebrow{color:var(--text-accent-sm)}
[data-tid="natt"] .wash .pc:not(.wash){--text-accent:#E6B65A;--text-accent-sm:#E6B65A}
.pc h3{margin:0 0 4px;font-size:17px}
.pc p{margin:0;font-size:14px;line-height:21px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:22px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--border);vertical-align:top}
th{font:600 12px/16px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
td:first-child{font-weight:600;color:var(--text-heading)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tscroll table{min-width:0}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li label{display:flex;gap:12px;align-items:flex-start;font-weight:400;color:var(--text-body);font-size:15px;line-height:23px;cursor:pointer;min-height:32px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--skog);flex:0 0 auto}
.dots{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.dots li{padding-left:22px;position:relative}
.dots li::before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--ockra)}
.nlist{list-style:none;counter-reset:n;padding:0;margin:0;display:grid;gap:14px}
.nlist li{counter-increment:n;padding-left:44px;position:relative}
.nlist li::before{content:counter(n);position:absolute;left:0;top:-2px;font:300 26px/1 var(--sans);color:var(--text-accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 14px/20px var(--sans);color:var(--text-heading)}
.flow span{border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:6px 14px}
.flow i{font-style:normal;color:var(--text-muted)}
.stat{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.stat .big{font:200 clamp(56px,8vw,96px)/1 var(--sans);letter-spacing:-.04em;color:var(--text-heading)}
.stat p{max-width:36ch;margin:0}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.twocol.r{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:860px){.twocol,.twocol.r{display:flex;flex-direction:column;gap:28px}.twocol>*{width:100%}}
.sub{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:8px}
.sub a{padding:12px 14px;font:600 14px/20px var(--sans);color:var(--text-muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub a[aria-current="page"]{color:var(--text-heading);border-color:var(--text-heading)}
.sub a:hover{color:var(--text-heading)}
.sub-wrap{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:30;background:var(--surface)}
.next{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:40px;border-top:1px solid var(--border)}
.next a.big{font:600 clamp(20px,2.4vw,26px)/1.3 var(--sans);text-decoration:none;color:var(--text-heading)}
.next a.big:hover{text-decoration:underline}
@media (max-width:620px){.next{grid-template-columns:1fr}}
.note{border-left:3px solid var(--ockra);padding:4px 0 4px 16px;color:var(--text-body);font-size:14.5px;line-height:23px;max-width:68ch}
.empty{border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:18px;color:var(--text-muted);font-size:14px;line-height:21px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px;line-height:22px}
.kv dt{font-weight:600;color:var(--text-heading)}
.kv dd{margin:0}
details{border-top:1px solid var(--border);padding:12px 0}
details summary{cursor:pointer;font:600 15px/22px var(--sans);color:var(--text-heading);min-height:32px;list-style-position:outside}
.copy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-alt);border-radius:var(--r-md);padding:12px 14px}
.copy code{font:600 16px/22px var(--sans);color:var(--text-heading);user-select:all;-webkit-user-select:all}

/* ===================================================== vandringen */
.walk{display:grid;gap:0}
.station{display:grid;grid-template-columns:14px minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:center;padding-block:36px;border-top:1px solid var(--border)}
.station .strip-v{align-self:stretch;background-color:var(--g);background-image:var(--img);background-size:cover;border-radius:7px}
.station.flip{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 14px}
.station.flip .strip-v{order:3}.station.flip .st-txt{order:1}.station.flip .st-img{order:2}
.st-img img{width:100%;aspect-ratio:4/3;object-fit:cover;mix-blend-mode:var(--plate-blend)}
.st-num{font:200 44px/1 var(--sans);color:var(--text-accent);display:block;margin-bottom:12px}
@media (max-width:760px){.station,.station.flip{grid-template-columns:10px minmax(0,1fr);gap:16px}.station .st-img,.station.flip .st-img{grid-column:2;order:0}.station .st-txt,.station.flip .st-txt{grid-column:2;order:1}.station .strip-v,.station.flip .strip-v{grid-row:1/span 2;order:0}}

/* ===================================================== kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font:600 11px/16px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:4px}
.cal .d{min-height:86px;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px;font-size:11px;line-height:14px;position:relative;background:var(--surface)}
.cal .d .dn{font:600 15px/1 var(--sans);color:var(--text-heading)}
.cal .d.red .dn{color:#B83A2B}
:root[data-tid="natt"] .tsym,.skymning .tsym{color:#E6B65A!important}
:root[data-tid="natt"] .cal .d.red .dn,.skymning .cal .d.red .dn,.wash .cal .d.red .dn{color:#E8836F}
.cal .d.today{outline:2px solid var(--text-accent);outline-offset:-2px}
.cal .d .mo{position:absolute;top:6px;right:6px;width:12px;height:12px}
.cal .d .ev{display:block;margin-top:4px;color:var(--text-heading);font-weight:500}
.cal .d .sun{position:absolute;bottom:4px;left:6px;right:6px;color:var(--text-muted);font-size:10px}
.cal .blank{border:0;background:transparent}
@media (max-width:700px){.cal .d{min-height:54px;padding:4px}.cal .d .ev,.cal .d .sun{display:none}.cal .d.has::after{content:"";position:absolute;left:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--text-accent)}}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mlist a{display:block;padding:14px;border-radius:var(--r-md);text-decoration:none;min-height:96px}
.mlist a b{display:block;font:600 15px/20px var(--sans)}
.mlist a span{font-size:12px;line-height:17px}
.ent{display:grid;grid-template-columns:120px 1fr;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--border)}
.ent .dt{font:600 13px/20px var(--sans);color:var(--text-accent-sm,var(--text-accent))}
.ent h4{margin:0 0 2px}
.ent p{margin:0;font-size:14.5px;line-height:22px}
@media (max-width:560px){.ent{grid-template-columns:1fr}}
.ics{font-size:12px}

/* ===================================================== odlingskalender */
.ok{display:grid;grid-template-columns:150px repeat(12,minmax(0,1fr));gap:2px;font-size:12px;align-items:center;min-width:620px}
.ok .mh{font:600 11px/16px var(--sans);text-align:center;color:var(--text-muted);padding:6px 0;border-radius:3px}
.ok .mh.now{background:var(--action-strong);color:var(--on-strong)}
.ok .cr{font:600 13px/18px var(--sans);color:var(--text-heading);padding:6px 8px 6px 0;display:flex;gap:6px;align-items:center}
.ok .cell{height:30px;border-radius:3px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--sans);position:relative}
.ok .cell.now{box-shadow:inset 0 0 0 2px var(--text-heading)}
.ok .s{background:repeating-linear-gradient(135deg,#C8DCE6 0 5px,#B0CAD6 5px 7px);color:#1C3449}
.ok .p{background:repeating-linear-gradient(0deg,#D9E096 0 5px,#C6CC89 5px 7px);color:#2C4A1E}
.ok .h{background:#D99D36;color:#1C1B17}

const LAT = 59.86, LON = 17.64, RAD = Math.PI / 180;
function jd(d) { return d.getTime() / 86400000 + 2440587.5; }
function sunTimes(date) {

  const noonUTC = new Date(Date.UTC(y, m, dd, 12, 0, 0));
  const J = jd(noonUTC), T = (J - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(M * RAD) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * RAD) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * RAD) * 0.000289;
  const tl = L0 + C, om = 125.04 - 1934.136 * T, lam = tl - 0.00569 - 0.00478 * Math.sin(om * RAD);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(om * RAD);
  const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lam * RAD));
  const yv = Math.tan(eps / 2 * RAD) ** 2;
  const eqt = 4 / RAD * (yv * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * yv * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * yv * yv * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD));
  const cosH = (Math.cos(90.833 * RAD) - Math.sin(LAT * RAD) * Math.sin(decl)) / (Math.cos(LAT * RAD) * Math.cos(decl));

  const H = Math.acos(cosH) / RAD;
  const base = Date.UTC(y, m, dd, 0, 0, 0);
  return { up: new Date(base + (noonMin - 4 * H) * 60000), down: new Date(base + (noonMin + 4 * H) * 60000), len: 8 * H };
}

function kalKey(ym) { if (ym === '2028-01') return 'vw_jan28'; if (ym === '2026-12') return 'vw_dec'; if (ym === '2028-02') return 'vw_feb'; return 'vw_' + ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'][+ym.slice(5) - 1]; }

const AVDAK = { vaxter: 'akvarell-detalj-skogstradgarden.jpg', blommor: 'akvarell-detalj-angen.jpg', frukt: 'akvarell-detalj-odling.jpg', faglar: 'akvarell-detalj-samfallighetsskogen.jpg', insekter: 'akvarell-detalj-golen.jpg', djur: 'akvarell-detalj-dammen.jpg', aret: 'akvarell-detalj-torpet.jpg', foremal: 'akvarell-detalj-forradet-verkstad.jpg' };
const AVDS = { vaxter: 'maj', blommor: 'juni', frukt: 'september', faglar: 'januari', insekter: 'juli', djur: 'augusti', aret: 'gryningen', foremal: 'november' };
const GRP = { angen: 'Ängen', dammen: 'Dammen', vasen: 'Vasen: pioner och rosor', kryddor: 'Kryddor och örter', tradgarden: 'Trädgården' };
async function vSamlingen(sub) {
  const list = Object.values(PL);
  const avd = AVD.find(a => a.join() && a[0] === sub);
  const items = avd ? list.filter(p => p.a === sub) : list;
  const head = avd
    ? `<div class="strip" style="${washVars(AVDS[sub])};height:14px"></div><div class="wrap"><section style="padding-bottom:16px"><div class="twocol r"><div>${eb('Samlingen · avdelning')}<h1 tabindex="-1">${avd[1]}</h1><p class="lead">${items.length} planscher. <a href="#samlingen">Hela samlingen</a></p></div><div>${ak(AVDAK[sub], avd[1], { cls: 'wide' })}</div></div></section></div>`
    : `<div class="wrap"><section style="padding-bottom:16px"><div class="twocol r"><div>${eb('Samlingen · plansch')}<h1 tabindex="-1">Platsens herbarium</h1>
       <p class="lead">Böckernas ${list.length} naturhistoriska planscher i von Wrights anda, inte som kopior, utan som en hyllning till ett sätt att se på naturen: noga, kärleksfullt och med respekt för varje detalj.</p>
       <p class="small muted">På dagen ligger planscherna som gräddvitt papper på kalk. Efter solnedgången byts de mot nattens versioner, ljusa graverade linjer i månljus mot nattskog.</p></div>
       <div class="grid g4">${AVD.filter(a => Object.values(PL).some(p => p.a === a[0])).map(a => `<a class="pc" href="#samlingen-${a[0]}"><div class="strip" style="${washVars(AVDS[a[0]])};height:8px"></div><div class="pc-b" style="padding:12px"><h3 style="font-size:14px">${a[1]}</h3><p class="small">${list.filter(p => p.a === a[0]).length}</p></div></a>`).join('')}</div></div></section></div>`;
  const books = BOOKS.map(b => b.t);
  return head + `<div class="wrap"><section style="padding-top:8px">
    <div class="filters"><div class="row"><label class="sr" for="psok">Sök på svenska eller latin</label><input id="psok" type="search" placeholder="Sök på svenska eller latin" style="width:min(360px,100%)">
     ${avd ? '' : `<select id="pavd" aria-label="Avdelning"><option value="">Alla avdelningar</option>${AVD.filter(a => Object.values(PL).some(p => p.a === a[0])).map(a => `<option value="${a[0]}">${a[1]}</option>`).join('')}</select>`}
     <select id="pbok" aria-label="Bok"><option value="">Alla böcker</option>${books.map(b => `<option>${b}</option>`).join('')}</select>
     ${sub === 'blommor' ? `<select id="pgrp" aria-label="Rum"><option value="">Alla rum</option>${Object.entries(GRP).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>` : ''}
     <button class="chip" type="button" id="pmanad" aria-pressed="false">Visa bara månadens art</button></div><span class="cnt" id="pcnt" aria-live="polite">${items.length} planscher</span></div>
    <div class="herb" id="herb">${items.map(p => `<div data-p="${p.k}" data-a="${p.a}" data-g="${p.g || ''}" data-b="${esc((p.b || []).join('|'))}" data-s="${esc((p.t + ' ' + p.l + ' ' + (p.alt || []).map(a => a.t + ' ' + a.l).join(' ')).toLowerCase())}">${plate(p.k, { mini: 1 })}</div>`).join('')}</div>
   </section></div>`;
}
function filterPl() {
  const q = ($('#psok').value || '').toLowerCase(), a = ($('#pavd') || {}).value || '', b = $('#pbok').value, g = ($('#pgrp') || {}).value || '', mo = $('#pmanad').getAttribute('aria-pressed') === 'true';
  const art = 'vw_' + ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'][todayP().m - 1];
  let n = 0;
  $$('#herb [data-p]').forEach(x => { const on = (!q || x.dataset.s.includes(q)) && (!a || x.dataset.a === a) && (!b || x.dataset.b.split('|').includes(b)) && (!g || x.dataset.g === g) && (!mo || x.dataset.p === art); x.hidden = !on; if (on) n++; });
  $('#pcnt').textContent = n ? `${n} planscher` : 'Inget här just nu. Prova en annan månad.';
}
document.addEventListener('input', e => { if (['psok', 'pavd', 'pbok', 'pgrp'].includes(e.target.id)) filterPl(); });
document.addEventListener('change', e => { if (['pavd', 'pbok', 'pgrp'].includes(e.target.id)) filterPl(); });
document.addEventListener('click', e => { const b = e.target.closest('#pmanad'); if (b) { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); filterPl(); } });
const BOOKLINK = { 'Solglänta': 'solglanta', 'Verkstäderna': 'verkstaderna', 'Mötesplatsen': 'motesplatsen', 'Köken': 'koken', 'Boendet': 'boendet', 'Caféet och Shopen': 'cafeet-och-shopen', 'Odlingen': 'odlingen', 'Verktygen': 'verktygen', 'Andligheten': 'andligheten', 'Kalenderåret': 'kalenderaret', 'Årets andetag': 'arets-andetag' };
function vPlansch(hk) {
  const k = PLH[hk]; if (!k) return notFound();
  const p = PL[k];
  const lst = Object.values(PL).filter(x => x.a === p.a), i = lst.indexOf(p), prev = lst[i - 1], nx = lst[i + 1];
  const avd = AVD.find(a => a[0] === p.a);
  return `<div class="wrap"><section><div class="plate-solo"><div>${plate(k, { link: false, text: false })}
     <div class="twin"><figure class="tdag"><img src="pl/dag/${p.f}" alt="${esc(p.t)}, dagversion" loading="lazy" decoding="async" width="880" height="1100"><figcaption>Dag · papper på kalk</figcaption></figure><figure class="tnatt"><img src="pl/natt/${p.f}" alt="${esc(p.t)}, nattversion" loading="lazy" decoding="async" width="880" height="1100"><figcaption>Natt · ljusa linjer mot nattskog</figcaption></figure></div></div>
    <div>${eb(`Samlingen · <a href="#samlingen-${p.a}">${avd ? avd[1] : ''}</a>`)}<h1 tabindex="-1">${esc(p.t)}</h1>${p.l ? `<p class="lat" style="font:italic 400 22px/1.4 var(--serif);color:var(--text-muted)">${esc(p.l)}</p>` : ''}
     ${p.w ? `<p><span class="tag">${p.w}</span></p>` : ''}${p.n ? `<p class="note">${esc(p.n)}</p>` : ''}
     ${p.x ? `<p class="lead">${esc(p.x)}</p>` : ''}
     ${(p.alt || []).map(a => `<div class="card alt" style="margin-top:12px"><span class="eyebrow">I ${esc(a.b)}</span><h3>${esc(a.t)}</h3><p class="lat" style="font:italic 15px/22px var(--serif)">${esc(a.l)}</p>${a.x && a.x !== p.x ? `<p>${esc(a.x)}</p>` : ''}</div>`).join('')}
     <h3 style="margin-top:24px">Finns i böckerna</h3><div class="row">${(p.b || []).map(b => `<a class="btn btn-ghost" href="#${BOOKLINK[b]}">${b}</a>`).join('')}</div>
     <div class="row" style="margin-top:24px;justify-content:space-between">${prev ? `<a class="link" href="#plansch-${prev.k.replace(/_/g, '-')}">← ${esc(prev.t)}</a>` : '<span></span>'}${nx ? `<a class="link" href="#plansch-${nx.k.replace(/_/g, '-')}">${esc(nx.t)} ${ARR}</a>` : ''}</div></div></div></section></div>`;
}

/* ============================================================ besök, böckerna, om, 404 */
async function vBesok(sub) {
  return `<div class="wrap"><section><div class="twocol r"><div>${eb('Besök')}<h1 tabindex="-1">Välkommen till Vreta</h1>
    <p class="lead">Vi tar emot små grupper. Skriv vad ni vill göra, så föreslår vi en tid. Skriv till Vreta Solglänta · <a href="mailto:hej@vri.earth">hej@vri.earth</a>.</p>
    <ul class="dots" style="font-size:17px;line-height:27px;margin:24px 0"><li>Egen fika välkommen.</li><li>Hundar är välkomna i koppel.</li><li>Utanför Uppsala, nära Ekoln. Vägbeskrivning får du när besöket är bekräftat.</li></ul></div>
    <div>${ak('akvarell-detalj-langbordet.jpg', 'Långbordet under eken')}</div></div></section>
   <section style="padding-top:0" id="anmal"><div class="card" style="max-width:820px">${eb('Anmäl intresse')}<h2>Skriv till Vreta Solglänta</h2>
    <p>Sajten har inget formulär och samlar inga uppgifter. Kopiera adressen och berätta vad ni vill uppnå, hur många ni är, när ni vill komma, hur länge och vad ni vill göra med händerna.</p>
    <div class="copy"><code>${MAIL}</code><button class="chip" type="button" data-copy="${MAIL}">Kopiera adressen</button></div>
    <div class="row" style="margin-top:16px"><a class="btn btn-primary" href="#motesplatsen-planera">Hjälp mig skriva mejlet ${ARR}</a></div>${hand('Vi ses på nästa varv.')}</div></section>
   ${hemBlock()}</div>`;
}
async function vBockerna() {
  return `<div class="wrap"><section>${eb('Bokserien')}<h1 tabindex="-1">Elva böcker, en plats</h1><p class="lead">Böckerna är sajtens material. En bok är marken, åtta är rummen och två är himlen. Var och en har sin säsongsbakgrund och sin tumflik.</p>
   <div class="grid auto" style="margin-top:28px">${BOOKS.map(b => `<a class="pc wash" style="${b.id === 'andligheten' ? '--g:#14261F;--t:#EFE6D6;--e:#E6B65A;--img:none' : washVars(b.id === 'kalenderaret' ? curMonthSeason() : b.s)}" href="#${b.id}"><div class="pc-b" style="min-height:220px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:200 54px/1 var(--sans)">${b.n}</span><div><span class="eyebrow">${b.n === 1 ? 'Marken' : b.n >= 10 ? 'Himlen' : 'Rummet'} · ${b.rum}</span><h2 style="margin:0">${b.t}</h2><p class="hand" style="font-size:26px;margin-top:8px">${b.sign}</p></div></div></a>`).join('')}</div></section></div>`;
}
async function vOm() {
  return `<div class="wrap narrow" style="max-width:820px;margin:0 auto"><section>${eb('Om sajten')}<h1 tabindex="-1">Om sajten</h1>
   <h2>Tre slags bilder</h2><p>Bilder och texter på sajten är skapade med AI och styrda av oss. De visar platsen och livet här som den är tänkt att levas. Det vi erbjuder besökare gäller det som står på sidan <a href="#besok">Besök</a>.</p><dl class="kv"><dt>Akvarell</dt><dd>Platsen som berättelse. Varje rum börjar med en akvarell.</dd><dt>Plansch</dt><dd>Arter, växter, djur och verktyg, tecknade i von Wrights anda. På natten visas samma plansch som ljusa linjer mot nattskog.</dd><dt>Fotorealistiska bilder</dt><dd>Stämningen och samvaron. De visar hur det känns att vara här, inte dokumenterade tillfällen. Ingen namnges.</dd></dl>
   <h2 style="margin-top:28px">Kartan</h2><p>Kartan är en förenklad plan efter nybyggnadskartan, inte skalenlig: norr uppåt, vägen längs den sydvästra sidan med syrenhäcken och infarten mitt på, dammen i västra delen. Omgivningen, med Ekoln, kärren, Hammarskog och Vreta udde, har en egen karta.</p>
   <h2>Dag, natt och följ solen</h2><p>Sajten räknar ut soluppgång och solnedgång för Uppsala i din webbläsare. Efter solnedgången blir den nattskog och månljus, och planscherna byts mot nattens versioner. Ditt val sparas bara i din webbläsare.</p>
   <h2>Sajten samlar ingen persondata</h2><p>Det finns inga formulär. Intresseanmälan skickar du själv från din e-post. Mejl till hej@vri.earth tas emot av Vreta Solglänta, används bara för att svara dig och raderas när ärendet är klart. Det du skriver i Årets andetag och de listor du bockar av stannar i din webbläsare.</p></section></div>`;
}
function notFound() { return `<div class="wrap"><section style="padding-block:120px"><h1 tabindex="-1">Den här stigen är igenvuxen.</h1><p><a class="btn btn-primary" href="#cafeet-och-shopen">Tillbaka till grinden ${ARR}</a></p></section></div>`; }

/* ============================================================ router */
const ROOMS = { solglanta: vSolglanta, 'cafeet-och-shopen': vCafeet, verkstaderna: vVerkstaderna, verktygen: vVerktygen, motesplatsen: vMotesplatsen, odlingen: vOdlingen, andligheten: vAndligheten, boendet: vBoendet, koken: vKoken, kalenderaret: vKalenderaret, 'arets-andetag': vAndetag, samlingen: vSamlingen, karta: vKarta, besok: vBesok };
let lastRoute = null;
function parse(h) {
  h = decodeURIComponent(h.replace(/^#/, ''));
  if (!h || h === 'innehall') return ['home'];
  if (h.startsWith('plansch-')) return ['plansch', h.slice(8)];
  const simple = { 'i-dag': vIdag, 'i-natt': vInatt, rummen: vRummen, aret: vAret, bockerna: vBockerna, om: vOm };
  if (simple[h]) return [h];
  const keys = Object.keys(ROOMS).sort((a, b) => b.length - a.length);
  for (const k of keys) { if (h === k) return [k, '']; if (h.startsWith(k + '-')) return [k, h.slice(k.length + 1)]; }
  return ['404'];
}
async function route() {
  const [r, sub] = parse(location.hash);
  NOW = new Date(); applyLight(); setSkyIcon();
  const main = $('#innehall');
  const book = BK[r] ? r : null;
  renderTabs(book);
  $$('.nav a').forEach(a => a.removeAttribute('aria-current'));
  const navKey = r === 'solglanta' ? 'solglanta' : WALK.includes(r) ? 'rummen' : ['kalenderaret', 'arets-andetag', 'i-dag', 'i-natt', 'aret'].includes(r) ? 'aret' : r === 'plansch' ? 'samlingen' : r;
  const na = $(`.nav a[data-nav="${navKey}"]`); if (na) na.setAttribute('aria-current', 'page');
  document.body.classList.toggle('andl-on', r === 'andligheten');
  let html;
  try {
    if (r === 'home') html = await vHome();
    else if (r === 'plansch') html = vPlansch(sub);
    else if (r === '404') html = notFound();
    else if (ROOMS[r]) {
      let s = sub;
      if (r === 'kalenderaret' && s === 'hem') s = '';
      if (r === 'besok' && s === 'anmal') s = 'anmal';
      html = await ROOMS[r](s);
    } else html = await ({ 'i-dag': vIdag, 'i-natt': vInatt, rummen: vRummen, aret: vAret, bockerna: vBockerna, om: vOm })[r]();
  } catch (err) { console.error(err); html = `<div class="wrap"><section><h1 tabindex="-1">Platsen vaknar inte riktigt.</h1><p>Något gick fel när sidan skulle laddas. Prova att ladda om.</p></section></div>`; }
  main.innerHTML = html;
  renderFoot(r === 'andligheten');
  const key = location.hash;
  const scrollTarget = (r === 'kalenderaret' && sub === 'hem') ? '#hem' : (r === 'besok' && sub === 'anmal') ? '#anmal' : null;
  if (scrollTarget && $(scrollTarget)) $(scrollTarget).scrollIntoView(); else window.scrollTo(0, 0);
  hydrate(r, sub);
  const h1 = $('h1', main); if (h1 && lastRoute !== null) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  const t = h1 ? strip(h1.textContent) : '';
  document.title = r === 'home' ? 'Vreta Solglänta' : `${t} · Vreta Solglänta`;
  lastRoute = key;
}
function rerenderSoft() { setSkyIcon(); swapPlates(); renderFoot($('#innehall .andl') != null); }
function hydrate(r, sub) {
  if ($('#skiktdata')) skikt(1);
  if ($('#fragor')) askFragor();
  if ($('#hlist')) filterHacks();
  if ($('#dorrdata')) doorRender(0);
  if ($('#temadata')) temaRender(0);
  if ($('#plandata')) { planAns = []; planRender(); }
  if ($('#dukdata')) { dukState = []; dukRender(); }
  if ($('#prdata')) { prI = 0; prRender(); }
  if ($('#inbj')) inbjRender();
  if ($('#mlist')) filterMeals();
  const L = $$('.layer');
  if (L.length) {
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) L.forEach(x => x.classList.add('in'));
    else { const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -10% 0px' }); L.forEach((x, i) => { x.style.transitionDelay = (i * 120) + 'ms'; io.observe(x); }); }
  }
}
/* ark: meny och bokrygg */
function trapKeys(e) { const s = $('.sheet.open'); if (!s || e.key !== 'Tab') return; const f = $$('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])', s).filter(x => x.offsetParent !== null); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
document.addEventListener('keydown', trapKeys);
function setInert(on) { ['main', 'header', '.foot', '.tabs'].forEach(q => { const el = document.querySelector(q); if (el) { if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); } }); }
function openSheet(id, btn) { const s = $(id); setInert(true); s.classList.add('open'); if (btn) btn.setAttribute('aria-expanded', 'true'); const f = $('a,button', $('.sheet-p', s)); if (f) f.focus(); s._btn = btn; }
function closeSheets() { setInert(false); $$('.sheet.open').forEach(s => { s.classList.remove('open'); if (s._btn) { s._btn.setAttribute('aria-expanded', 'false'); s._btn.focus(); } }); }
document.addEventListener('click', e => {
  if (e.target.closest('#menubtn')) openSheet('#menysheet', $('#menubtn'));
  else if (e.target.closest('#spinebtn')) openSheet('#spinesheet', $('#spinebtn'));
  else if (e.target.closest('[data-close]') || (e.target.closest('.sheet a'))) closeSheets();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('#skiplink'); if (!a) return; e.preventDefault(); const m = $('#innehall'); m.focus(); m.scrollIntoView(); });

/* ============================================================ start */
(async function init() {
  applyLight();
  renderTabs(null);
  try {
    const list = await load('planscher');
    let finns = null; try { finns = new Set(await load('pl-finns')); } catch (e) { finns = null; }
    list.filter(p => !finns || finns.has(p.f)).forEach(p => { PL[p.k] = p; PLH[p.k.replace(/_/g, '-')] = p.k; });
  } catch (e) { console.error(e); }
  await route();
})();

/* språkväxlaren följer vyn: /#x ↔ /en/#x */
function syncLang() { document.querySelectorAll('.lang-sw, .lang-alt').forEach(a => a.setAttribute('href', '/en/' + (location.hash || ''))); }
['click', 'auxclick', 'focusin', 'mouseover'].forEach(t => document.addEventListener(t, e => { if (e.target.closest && e.target.closest('.lang-sw, .lang-alt')) syncLang(); }, true));
window.addEventListener('hashchange', syncLang); syncLang();
</script>
